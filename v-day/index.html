
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Will You Be My Valentine, Charlie? 💛</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- SHARED CSS -->
    <link rel="stylesheet" href="/charlie-emil/style.css">

    <!-- VALENTINE CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="/charlie-emil/favicon.svg">
</head>

<body class="valentine-page">

    <!-- SHARED NAVIGATION -->
    <div id="navbar-placeholder"></div>

    <!-- BACKGROUND DECORATION -->
    <div class="hearts-bg"></div>

    <main class="valentine-container">

        <div class="valentine-decoration">
            ✨ ♡ ✨
        </div>

        <span class="valentine-label">
            A VERY IMPORTANT QUESTION
        </span>

        <h1>Will you be my Valentine, Charlie?</h1>

        <p class="valentine-subtitle">
            I have something very special to ask you...
        </p>

        <!-- ORIGINAL GIF -->
        <div class="gif-container">
            <img
                id="cat-gif"
                src="https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif"
                alt="Cute character"
            >
        </div>

        <!-- ORIGINAL BUTTONS -->
        <div class="buttons">

            <button
                id="yes-btn"
                onclick="handleYesClick()"
            >
                Yes! 💛
            </button>

            <button
                id="no-btn"
                onclick="handleNoClick()"
            >
                No 🙄
            </button>

        </div>

        <div id="tease-toast"></div>

        <div class="valentine-footer">
            made with <span class="heart">♥</span> for Charlie
        </div>

    </main>

    <!-- MUSIC -->
    <audio id="bg-music" loop autoplay muted>
        <source src="music/beabadoobee - Glue Song (Lyrics).mp3" type="audio/mpeg">
    </audio>

    <button
        id="music-toggle"
        onclick="toggleMusic()"
        title="Toggle music"
        aria-label="Toggle background music"
    >
        🔊
    </button>

    <!-- SCRIPTS -->
    <script src="/charlie-emil/navbar.js"></script>
    <script src="script.js"></script>

</body>
</html>
