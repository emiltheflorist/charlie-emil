<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Galerie ♡ | Charlie & Emil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="/charlie-emil/favicon.svg">
    <link rel="stylesheet" href="/charlie-emil/style/style.css">
    <link rel="stylesheet" href="/charlie-emil/style/galerie.css">
</head>

<body class="galerie-page" data-title-key="gallery.title">

    <div id="navbar-placeholder"></div>

    <main class="gallery-container">

        <header class="gallery-header">
            <h1>Galerie <span>♡</span></h1>
            <p data-i18n="gallery.subtitle">
                All the little moments that make our story.
            </p>
        </header>

        <div id="gallery"></div>

    </main>

    <div class="photo-viewer" id="photo-viewer">

        <button class="viewer-close" id="viewer-close"
            data-i18n-attr="aria-label:gallery.close">×</button>

        <button class="viewer-arrow viewer-prev" id="viewer-prev"
            data-i18n-attr="aria-label:gallery.previous">‹</button>

        <div class="viewer-content">
            <img id="viewer-image" src="" alt="Memory">

            <div class="viewer-info">
                <p id="viewer-date"></p>

                <button id="memory-toggle" data-i18n="gallery.read">
                    ♡ Read this memory
                </button>

                <div id="memory-note" hidden></div>
            </div>
        </div>

        <button class="viewer-arrow viewer-next" id="viewer-next"
            data-i18n-attr="aria-label:gallery.next">›</button>

    </div>

    <script src="/charlie-emil/navbar.js"></script>
    <script src="/charlie-emil/language.js"></script>
    <script src="/charlie-emil/galerie.js"></script>

</body>
</html>
